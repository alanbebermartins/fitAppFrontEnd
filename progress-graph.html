<!DOCTYPE html>
<html lang="en">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Gráfico de progresso</title>
    <script src="assets/js/api-config.js"></script>
    <script src="/assets/js/auth-check.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/header.css" rel="stylesheet">
</head>
<header>
    <div class="header py-3 px-5">
        <h1 class="p-4 d-flex w-100 justify-content-center">Gráfico de progresso</h1>
        <nav>
            <ul class="header-links d-flex align-items-center justify-content-center gap-4 p-0" style="list-style-type: none;">
                <li><button id="dashboardButton" class="py-2 px-3 rounded-2 text-white bg-primary border-0"><a>Dashboard</a></button></li>
                <li><button id="graphButton" class="py-2 px-3 rounded-2 text-white bg-primary border-0"><a>Gráfico de progresso</a></button></li>
                <li><button id="logoutButton" class="py-2 px-3 rounded-2 text-white bg-primary border-0"><a>Sair</a></button></li>
            </ul>
        </nav>
    </div>
</header>
<body class="d-flex align-items-center bg-dark-subtle flex-column gap-3">

    <div class="d-flex justify-content-center bg-black p-3 rounded-4 w-100 mx-auto mb-3" style="max-width: 980px">
        <form action="" class="d-flex justify-content-center gap-3 flex-column w-100">
            <div class="w-100">
                <div class="w-100 d-flex flex-column gap-3">
                    <label class="text-white w-100" for="selectMuscleGroup">Grupo muscular</label>
                    <select class="w-100 border-3 border rounded-2 fs-6 fw-normal" name="selectMuscleGroup" id="selectMuscleGroup" style="min-height: 40px;">
                        <option value="" selected disabled>Selecione uma opção</option>
                    </select>
                </div>
            </div>
            <div class="w-100">
                <div class="w-100 d-flex flex-column gap-3">
                    <label class="text-white w-100" for="exerciseSelect">Exercício</label>
                    <select class="w-100 border-3 border rounded-2 fs-6 fw-normal" name="exerciseSelect" id="exerciseSelect" style="min-height: 40px;">
                        <option value="" selected disabled>Selecione uma opção</option>
                    </select>
                </div>
            </div>
            <div class="w-100 d-flex justify-content-center pt-3 gap-3">
                <button type="submit" class="btn btn-primary" id="searchBtn">Buscar</button>
                <button type="submit" class="btn btn-primary" id="clearBtn">Limpar consulta</button>
            </div>
        </form>
    </div>

    <div class="bg-white p-4 w-100 rounded-4" style="max-width: 980px">
        <h4 class="text-black mb-3 w-100 text-center">Gráfico de evolução da carga de treino</h4>
        <canvas id="progressChart"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/progress-graph.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/logout.js"></script>
</body>
</html>
